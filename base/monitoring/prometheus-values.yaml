# Prometheus — documented Helm values (ConfigMap, not a Helm deployment)
# Wave 7
# For live Helm management, convert the monitoring Application to a multi-source
# Helm app pointing at https://prometheus-community.github.io/helm-charts
# (chart: kube-prometheus-stack).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-helm-values
  namespace: monitoring
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
data:
  values.yaml: |
    prometheus:
      prometheusSpec:
        retention: 7d  # VPS is self-sufficient for alerting
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        # Remote write to home-cluster Mimir for unified historical view.
        # Routed via home-pi's advertised 192.168.5.0/24 subnet route (Headscale #1).
        # Buffered and retried if the route is down — VPS 7d local retention
        # means no alerting gap.
        remoteWrite:
          - url: "http://192.168.5.11:8080/api/v1/push"
            headers: { X-Scope-OrgID: "anonymous" }

    grafana:
      enabled: true
      adminPassword: PLACEHOLDER  # configured via NixOS host agenix

    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: ntfy
          group_by: [alertname]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
        receivers:
          - name: ntfy
            webhook_configs:
              - url: "https://ntfy.sh/2143-site-outages"
                send_resolved: true
    nodeExporter:
      enabled: true
    kubeStateMetrics:
      enabled: true

    # Blackbox exporter for external probes (home-pi, john2143.com, etc.)
    prometheusBlackboxExporter:
      enabled: true